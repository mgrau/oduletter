title: oduletter
author: Matt Grau
version: 1.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      date-format: long
      date: today
    pdf:
      documentclass: letter
      papersize: letter
      fontsize: 11pt
      mainfont: Times New Roman
      sansfont: Arial
      pdf-engine: xelatex
      geometry: margin=1in
      colorlinks: true
      signed: true
      include-in-header: header.tex
      template-partials:
        - partials/before-body.tex
        - partials/after-body.tex
        - partials/_address.tex
        - partials/_sig.tex
        - partials/_footer.tex
      format-resources:
        - signature.pdf
        - logo.pdf
